# یادداشت: شناسه‌های KV زیر مربوط به همین دیپلوی هستند؛
# اگر فورک می‌کنی، شناسه‌های فضای خودت را بگذار (wrangler kv namespace create ...).
name = "rich-post-bot"
main = "index.js"
compatibility_date = "2026-09-28"

[[kv_namespaces]]
binding = "KV"
id = "8eff5bd6b33a4a79ba3d869ef373065a"

[[kv_namespaces]]
binding = "KV_FRESH"
id = "32075883d0054d95ad579888f58ff613"

[[kv_namespaces]]
binding = "RASA_KV"
id = "f7714cd6f0e74ae0b55d73107fa8d88e"

[[durable_objects.bindings]]
name = "STATE"
class_name = "State"

[vars]
WEBHOOK_PATH = "/telegram/webhook"
